name: Auto-Generate SEO Blog Post

on:
  schedule:
    # Runs Tuesday & Thursday at 10:37 UTC (5:37 AM US Central / 6:37 AM US Eastern / 3:37 AM US Pacific)
    - cron: '37 10 * * 2,4'
  workflow_dispatch:

jobs:
  generate_blog_post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: npm ci

      - name: Run blog generation & static HTML/RSS builder
        run: |
          node scripts/generate_post.mjs --build

      - name: Check for new blog content
        id: check_diff
        run: |
          git add src/content/blog/ public/sitemap.xml public/feed.xml public/blog/
          if git diff --staged --quiet; then
            echo "has_changes=false" >> $GITHUB_OUTPUT
            echo "No new blog post generated."
          else
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "New blog post generated."
          fi

      - name: Build Web App
        if: steps.check_diff.outputs.has_changes == 'true'
        run: npm run build

      - name: Authenticate to Google Cloud
        if: steps.check_diff.outputs.has_changes == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/171658556844/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-action-1311198724@kibo-climb.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        if: steps.check_diff.outputs.has_changes == 'true'
        run: npx -y firebase-tools deploy --only hosting --project kibo-climb

      - name: Broadcast to Newsletter Subscribers
        if: steps.check_diff.outputs.has_changes == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          SENDER_EMAIL: "Kibo Climb <updates@kiboclimb.com>"
        run: |
          if [ -n "$RESEND_API_KEY" ]; then
            node scripts/broadcast_blog_post.mjs --latest
          else
            echo "RESEND_API_KEY not configured in GitHub Secrets. Skipping email broadcast."
          fi

      - name: Commit and push changes
        if: steps.check_diff.outputs.has_changes == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "content: auto-generate blog post, deploy & broadcast"
          git push origin main
