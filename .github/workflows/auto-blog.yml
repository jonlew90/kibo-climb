name: Auto-Generate SEO Blog Post

on:
  schedule:
    # Runs Tuesday & Thursday at 14:00 UTC (9:00 AM US Central / 10:00 AM US Eastern / 7:00 AM US Pacific)
    - cron: '0 14 * * 2,4'
  workflow_dispatch:

jobs:
  generate_blog_post:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run blog generation & static HTML/RSS builder
        run: |
          node scripts/generate_post.mjs --build

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/content/blog/ public/sitemap.xml public/feed.xml public/blog/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "content: auto-generate blog post [skip ci]"
            git push origin main
          fi
