name: Hourly Deploy to Firebase Hosting

on:
  schedule:
    # Runs at minute 0 past every hour (every 60 minutes)
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout main branch
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - name: Check for new changes and rate limit
        id: check_changes
        run: |
          LATEST_SHA=$(git rev-parse HEAD)
          TAG_SHA=$(git rev-parse -q --verify "refs/tags/last-deployed-prod" || echo "")

          # Check for new commits
          if [ "$LATEST_SHA" = "$TAG_SHA" ]; then
            echo "No new commits on main since last deploy ($TAG_SHA). Skipping."
            echo "has_changes=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Manual triggers bypass rate limiting
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "Manual trigger: bypassing rate limit."
            echo "has_changes=true" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check 1-hour (3600s) rate limit against last deployed commit timestamp
          if [ -n "$TAG_SHA" ]; then
            TAG_TIME=$(git log -1 --format=%ct "$TAG_SHA")
            CURRENT_TIME=$(date +%s)
            ELAPSED=$(( CURRENT_TIME - TAG_TIME ))

            if [ "$ELAPSED" -lt 3600 ]; then
              MINUTES_REMAINING=$(( (3600 - ELAPSED) / 60 ))
              echo "Throttled: Last deploy was $ELAPSED seconds ago (< 3600s). Next deploy eligible in ~$MINUTES_REMAINING min."
              echo "has_changes=false" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi

          echo "New changes found and rate limit passed. Deploying."
          echo "has_changes=true" >> $GITHUB_OUTPUT

      - name: Install Dependencies
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm ci

      - name: Run Tests
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npx vitest run

      - name: Build
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npm run build

      - name: Authenticate to Google Cloud
        if: steps.check_changes.outputs.has_changes == 'true'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/171658556844/locations/global/workloadIdentityPools/github-actions-pool/providers/github-provider
          service_account: github-action-1311198724@kibo-climb.iam.gserviceaccount.com

      - name: Deploy to Firebase Hosting
        if: steps.check_changes.outputs.has_changes == 'true'
        run: npx -y firebase-tools deploy --only hosting --project kibo-climb

      - name: Update last deployed tag
        if: steps.check_changes.outputs.has_changes == 'true'
        run: |
          git tag -f last-deployed-prod HEAD
          git push -f origin last-deployed-prod
