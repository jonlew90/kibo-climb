<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching App Header Kibo Orange -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#E05600" />
    </linearGradient>

    <!-- Outer Glow Ring -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect x="16" y="16" width="480" height="480" rx="112" ry="112" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="104" ry="104" fill="none" stroke="url(#ringGrad)" stroke-width="8" stroke-opacity="0.6" />

  <!-- Mountain Emoji 🏔️ (Same icon used across the Kibo Math UI header) -->
  <text 
    x="50%" 
    y="55%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    font-size="310" 
    font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif"
  >🏔️</text>
</svg>
