<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#E05600" />
    </linearGradient>

    <!-- Mountain Base Gradient -->
    <linearGradient id="mountGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#F3F4F6" />
      <stop offset="100%" stop-color="#CBD5E1" />
    </linearGradient>

    <!-- Mountain Shadow Gradient -->
    <linearGradient id="shadowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#94A3B8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#64748B" stop-opacity="0.95" />
    </linearGradient>

    <!-- Spark Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Soft Drop Shadow Filter -->
    <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Squircle App Icon Container -->
  <rect x="16" y="16" width="480" height="480" rx="108" ry="108" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="100" ry="100" fill="none" stroke="#FFD08A" stroke-width="6" stroke-opacity="0.4" />

  <!-- Mountain Peaks -->
  <g filter="url(#dropShadow)">
    <!-- Back Mountain -->
    <polygon points="120,400 230,220 340,400" fill="#E2E8F0" />
    <polygon points="230,220 340,400 230,400" fill="#CBD5E1" />

    <!-- Main Front Mountain -->
    <polygon points="80,416 256,140 432,416" fill="url(#mountGrad)" />
    <!-- Right Slope Shadow -->
    <polygon points="256,140 432,416 256,416" fill="url(#shadowGrad)" />

    <!-- Snow Cap Highlight -->
    <polygon points="256,140 210,210 240,200 256,220 275,198 302,210" fill="#FFFFFF" />
  </g>

  <!-- Glowing Lightning Spark Symbol ⚡ at Peak -->
  <g filter="url(#dropShadow)" transform="translate(256, 110) scale(1.15)">
    <path d="M-6,-45 L18,-45 L2,-15 L22,-15 L-16,35 L-4,0 L-22,0 Z" fill="url(#goldGrad)" stroke="#FFFFFF" stroke-width="4" stroke-linejoin="round" />
  </g>
</svg>
