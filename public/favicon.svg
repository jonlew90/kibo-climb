<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient matching App Header Kibo Orange -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" />
      <stop offset="100%" stop-color="#E05600" />
    </linearGradient>

    <!-- Outer Gold Ring Accent -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE600" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
  </defs>

  <!-- Full Bleed Squircle Container -->
  <rect x="0" y="0" width="512" height="512" rx="100" ry="100" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="92" ry="92" fill="none" stroke="url(#ringGrad)" stroke-width="10" stroke-opacity="0.6" />

  <!-- Mountain Emoji 🏔️ Scaled Max to Fill Favicon Space -->
  <text 
    x="50%" 
    y="54%" 
    dominant-baseline="central" 
    text-anchor="middle" 
    font-size="435" 
    font-family="Apple Color Emoji, Segoe UI Emoji, Noto Color Emoji, sans-serif"
  >🏔️</text>
</svg>
