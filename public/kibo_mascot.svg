<svg viewBox="10 10 180 115" width="100%" height="100%" fill="none" xmlns="http://www.w3.org/2000/svg" shape-rendering="geometricPrecision" text-rendering="geometricPrecision" stroke-linecap="round" stroke-linejoin="round">
  <defs>
    <!-- Volumetric 3D Clay Body Gradients matching latest Mascot.jsx -->
    <radialGradient id="kibo3DBodyGrad" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ffb997" />
      <stop offset="60%" stop-color="#f58c63" />
      <stop offset="100%" stop-color="#d96236" />
    </radialGradient>

    <!-- White Face Patches -->
    <radialGradient id="kibo3DWhiteGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f2e8e3" />
    </radialGradient>

    <!-- Ear Inner Gradient -->
    <radialGradient id="kibo3DEarInner" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f7f2f0" />
    </radialGradient>
  </defs>

  <g id="kibo-mascot-face">
    <!-- Ears -->
    <g id="ears">
      <!-- Left Ear -->
      <path
        d="M 65 60 C 50 30, 40 15, 60 15 C 80 15, 85 30, 90 45 Z"
        fill="url(#kibo3DBodyGrad)"
        stroke="#8A2500"
        stroke-width="2.5"
      />
      <path
        d="M 65 55 C 55 35, 50 25, 62 25 C 75 25, 80 35, 85 45 Z"
        fill="url(#kibo3DEarInner)"
      />

      <!-- Right Ear -->
      <path
        d="M 135 60 C 150 30, 160 15, 140 15 C 120 15, 115 30, 110 45 Z"
        fill="url(#kibo3DBodyGrad)"
        stroke="#8A2500"
        stroke-width="2.5"
      />
      <path
        d="M 135 55 C 145 35, 150 25, 138 25 C 125 25, 120 35, 115 45 Z"
        fill="url(#kibo3DEarInner)"
      />
    </g>

    <!-- Head Base -->
    <ellipse cx="100" cy="80" rx="65" ry="45" fill="url(#kibo3DBodyGrad)" stroke="#8A2500" stroke-width="2.5" />

    <!-- Cheeks Fluff -->
    <path d="M 36 80 L 25 85 L 35 90 L 20 100 L 42 105 Z" fill="url(#kibo3DBodyGrad)" stroke="#8A2500" stroke-width="2.5" stroke-linejoin="round" />
    <path d="M 164 80 L 175 85 L 165 90 L 180 100 L 158 105 Z" fill="url(#kibo3DBodyGrad)" stroke="#8A2500" stroke-width="2.5" stroke-linejoin="round" />

    <!-- Face Patches (White) -->
    <g id="face-patches">
      <ellipse cx="75" cy="85" rx="20" ry="25" fill="url(#kibo3DWhiteGrad)" />
      <ellipse cx="125" cy="85" rx="20" ry="25" fill="url(#kibo3DWhiteGrad)" />
      <ellipse cx="100" cy="100" rx="22" ry="18" fill="url(#kibo3DWhiteGrad)" />
    </g>

    <!-- Blush -->
    <ellipse cx="70" cy="98" rx="8" ry="4" fill="#ff99a1" opacity="0.6" />
    <ellipse cx="130" cy="98" rx="8" ry="4" fill="#ff99a1" opacity="0.6" />

    <!-- Whiskers -->
    <path d="M 35 95 L 15 90 M 35 100 L 10 100 M 38 105 L 15 110" stroke="#5c3021" stroke-width="1.5" stroke-linecap="round" />
    <path d="M 165 95 L 185 90 M 165 100 L 190 100 M 162 105 L 185 110" stroke="#5c3021" stroke-width="1.5" stroke-linecap="round" />

    <!-- Eyebrows -->
    <ellipse cx="70" cy="62" rx="6" ry="4" fill="#ffffff" transform="rotate(-15 70 62)" />
    <ellipse cx="130" cy="62" rx="6" ry="4" fill="#ffffff" transform="rotate(15 130 62)" />

    <!-- Expressive Eyes with Sparkles -->
    <g id="eyes">
      <!-- Left Eye -->
      <ellipse cx="78" cy="83" rx="11" ry="14" fill="#4a271d" />
      <circle cx="75" cy="77" r="4" fill="#ffffff" />
      <path d="M 83 78 Q 83 81 86 81 Q 83 81 83 84 Q 83 81 80 81 Q 83 81 83 78 Z" fill="#ffffff" />
      <circle cx="79" cy="89" r="1.5" fill="#ffffff" />

      <!-- Right Eye -->
      <ellipse cx="122" cy="83" rx="11" ry="14" fill="#4a271d" />
      <circle cx="119" cy="77" r="4" fill="#ffffff" />
      <path d="M 127 78 Q 127 81 130 81 Q 127 81 127 84 Q 127 81 124 81 Q 127 81 127 78 Z" fill="#ffffff" />
      <circle cx="123" cy="89" r="1.5" fill="#ffffff" />
    </g>

    <!-- Nose -->
    <ellipse cx="100" cy="94" rx="5" ry="3.5" fill="#4a271d" />

    <!-- Happy Smile -->
    <path d="M 94 100 Q 97 105 100 100 Q 103 105 106 100" stroke="#4a271d" stroke-width="2" stroke-linecap="round" fill="none" />
  </g>
</svg>
